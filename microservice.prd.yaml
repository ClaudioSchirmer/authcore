# authcore — production profile template.
# Selected by APP_PROFILE=prd. Endpoints are bare ${VAR} on purpose: there is no
# localhost fallback to accidentally deploy with.
service: authcore

http:
  addr: ":8080"

  # ── THE REVERSE-PROXY TOPOLOGY, AND WHY IT IS COMMENTED ──────────────────────
  #
  # LEFT UNSET DELIBERATELY, not forgotten. Absent, the framework reads the request's
  # origin from the SOCKET: unforgeable, and on any deployment with an ingress or a
  # load balancer in front, that is the BALANCER's address on every request.
  #
  # THAT IS NOT ONLY A LOG QUALITY PROBLEM HERE. POST /auth/client/token compares
  # Client.allowedCIDRs against the resolved address, so an undeclared topology turns
  # a per-integration network restriction into "anything that reached us through our
  # own edge". A deployment in that state should leave allowedCIDRs EMPTY rather than
  # believe a control it does not have.
  #
  # Filling it in needs a fact this repository does not hold — the trusted range of
  # the edge THIS deployment sits behind — so the shape is here for whoever performs
  # the deploy, the same way the retiring signing key below is. Uncomment, name the
  # edge, and the allow-list starts meaning what an operator typing a /32 believes.
  #
  # trustProxy:
  #   enabled: true
  #   # The balancer's own address or range. Prefer this over `private: true`: with
  #   # private, a caller that is itself on RFC1918 space looks like a proxy hop and
  #   # its forwarded header becomes believable.
  #   proxies: ["${TRUSTED_PROXY_CIDR}"]
  #   # Per edge — CF-Connecting-IP behind Cloudflare, X-Real-IP behind some ingress
  #   # controllers. Unset means X-Forwarded-For.
  #   header: X-Forwarded-For

relational:
  dialect: postgres
  dsn: "${DATABASE_URL}"
  # Mandatory since v0.65.0, no default. The instant stamped on created_at, updated_at and
  # the archive/unarchive archived_at is read from Postgres once per write transaction, so
  # every replica shares one clock — the app clock is a per-POD clock, and two replicas in
  # drift stamp rows out of order with nothing in the write path able to notice. This
  # service is the IdP: its archived_at stamps carry revocation and its audit trail is
  # compared across replicas. Costs one extra round-trip per write TX.
  clock: db

migrations:
  dir: ./migrations/postgres
  # Explicit, though it is also the non-dev default: validate only and abort the boot
  # on a pending or dirty migration. Applying schema changes is a deploy step, not a
  # side effect of a pod starting.
  autoRun: check

openapi:
  uiPath: /docs
  rootRedirect: true
  # Note: under auth.mode jwt the framework auto-extends publicRoutes with
  # /openapi.json and the resolved UI path, so the documentation surface is reachable
  # without a token. Drop this block and Wiring.OpenAPI if the spec must not be public.

graphql:
  path: /graphql
  playground: false
  introspection: false

# THIS SERVICE IS ITS OWN IdP. It signs with auth.issuer and validates with
# auth.jwt, and the two are wired to each other. JWT_ISSUER feeds BOTH jwt.issuer
# and issuer.selfUrl from one variable on purpose: the framework refuses the boot
# when they disagree, and a service that issues and validates cannot hold two
# opinions about who it is. Splitting them into two vars would let a deploy set
# one and forget the other.
auth:
  mode: jwt
  jwt:
    algorithms: [RS256]
    issuer: "${JWT_ISSUER}"
    audience: "${JWT_AUDIENCE}"
    jwksUrl: "${JWKS_URL}"

  # The permission gate. A route that forgets RequirePermission aborts the boot
  # rather than shipping open — the scan runs over every registered route.
  authorization:
    enabled: true
    # users.tenant_id is NOT NULL, so a token with no tenant claim is malformed
    # rather than merely unscoped: required rejects it at the middleware with 403,
    # before any handler can read a row with an empty scope.
    tenant:
      enabled: true
      required: true

  # The claims that reach audit_events.actorClaims — deliberately SHORT. Actor
  # (the subject) and TenantID are already top-level fields on every audit event;
  # listing them here would only duplicate them into the JSON blob, where they are
  # worse to query than the indexed column.
  #
  # These two have no other vehicle: tenant_workspace because no other service in
  # the mesh has this service's tenants table, so without it every audit line out
  # there identifies its tenant by a UUID it cannot resolve at any price; email
  # because Actor on its own is a UUID too.
  #
  # EVERY CONSUMER SERVICE NEEDS THIS SAME LINE in its own yaml — the claims ride
  # in the token either way, but filterClaims drops whatever is not named here.
  auditClaims:
    - tenant_workspace
    - email
    # name is the CLIENT's analogue of email: a machine has no address, so its label
    # is the only human-readable thing an audit row could carry about who acted. The
    # user token already mints it, so this is one vocabulary rather than a per-kind
    # special case — the cost, said plainly, is that user audit rows gain a short
    # name string beside the email they already carry.
    - name
    # identity_kind says PERSON or MACHINE without anybody cross-referencing the
    # clients table. Both token routes mint it, so an audit row that lacks it was
    # written by neither.
    - identity_kind

  issuer:
    enabled: true
    # Never inherited from jwt.issuer, always explicit — same variable, so the
    # boot-time equality check can never fail on a typo.
    selfUrl: "${JWT_ISSUER}"
    audience:
      - "${JWT_AUDIENCE}"
    tokenTtlSeconds: 900
    maxTokenTtlSeconds: 3600
    refreshTokenTtlSeconds: 2592000
    # A LIST from day one, even holding a single key: rotation is then an edit
    # (add `next`, wait a propagation window, promote) rather than a restructure
    # under time pressure. Bare ${VARS}, no defaults — a signing key has no
    # sensible fallback.
    keys:
      - kid: "${JWT_SIGNING_KID}"
        algorithm: RS256
        state: current
        privateKeyPem: "${JWT_SIGNING_KEY}"
      # The retiring key during a rotation. Left commented rather than absent so
      # the shape is in front of whoever performs one: promote next -> current,
      # old current -> previous, and drop this entry only after the longest access
      # token TTL has elapsed.
      # - kid: "${JWT_SIGNING_KID_PREVIOUS}"
      #   algorithm: RS256
      #   state: previous
      #   privateKeyPem: "${JWT_SIGNING_KEY_PREVIOUS}"
    # The block's PRESENCE mounts GET <path> as a public route — a JWKS document
    # that needed a bearer to fetch could never bootstrap trust in itself. This is
    # what every consumer service's auth.jwt.jwksUrl points at.
    jwks:
      path: /.well-known/jwks.json

  # The probes are framework-owned but NOT auto-public: without these entries a
  # tokenless kubelet gets 401 and the orchestrator kills a healthy pod. The
  # "METHOD /path" form is mandatory and validated at boot against the registered
  # routes — a typo aborts the boot.
  #
  # The two token routes are public for the obvious reason: a login cannot require
  # the credential it is about to grant.
  publicRoutes:
    - GET /livez
    - GET /readyz
    - POST /auth/user/token
    - POST /auth/user/token/refresh
    # The machine sign-in. Public for the same reason as the two above, and there is
    # no /refresh companion: a client-credentials grant issues no refresh token
    # (RFC 6749 4.4.3) because the client's secret already IS its long-lived
    # credential.
    #
    # WHERE FROM: Client.allowedCIDRs is enforced at this route and nowhere else, and
    # it compares against the ORIGIN ADDRESS AS THIS PROCESS SEES IT — the socket peer.
    # The framework reads no proxy header (it sets neither TrustProxy nor ProxyHeader
    # on the Fiber app), which is why nothing here is spoofable; the flip side is that
    # behind an ingress or a load balancer every request carries the BALANCER's
    # address, so an allow-list of real egress ranges refuses everybody and one
    # holding the balancer's range admits everybody. Leave the collection empty on
    # such a deployment until omnicore ships a trusted-proxy block.
    - POST /auth/client/token

shutdown:
  drainTimeoutSeconds: 30
  tracingDrainSeconds: 5
  hardGraceSeconds: 5
