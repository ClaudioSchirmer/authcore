# Role — a tenant's own cut of the global permission catalog.
#
# Model authority: scaffold-entity/role/spec.md (Status: APPROVED, amended 2026-08-21 for
# the v0.56.0 pin). Nothing here re-decides the model; where this file and that spec
# disagree, the spec wins.
#
# The single idea this file encodes: PERMISSION says what the platform can enforce; ROLE
# says which of those a given customer has bundled together and hands out. It is the third
# node of User -> Group -> Role -> Permission, and the FIRST aggregate in this service that
# is owned by a tenant rather than by the platform — which is what every authz line below
# exists for.
#
# Two things worth knowing before reading further:
#
#   1. A grant stores the catalog row's ID and nothing else (spec Q2). The rendered
#      resource:action pair is deliberately NOT copied in, so a retired-and-recreated
#      permission is never silently re-granted. The cost is that a read answers UUIDs and
#      the client joins by id — with no Mongo there is no read-time join.
#   2. The no-escalation rule is a PAIR (R9b then R9a), not one rule, because
#      Identity.HasPermission PANICS on any argument containing '*'. R9b removes the
#      wildcard input; R9a then asks the question safely.
#
# Discovered from the project: dialect postgres · read backing relational.

specVersion: 1
entity: Role
plural: Roles
language: en-US

storage:
  kind: flat
  table: roles
  description: >-
    A tenant's own bundle of catalog permissions — the unit a user or a group is granted.
    Owned by exactly one tenant; the platform's own roles live in the reserved platform
    tenant rather than in a null scope.
  managed:
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # The owner. NOT assignedFrom: a *:* operator creates roles inside a customer's tenant
  # while carrying no tenant claim of their own, so the value has to be able to arrive in
  # the body. What stops an ordinary caller from writing another tenant's id is the write
  # guard authz.dataAccess: tenant generates, not the absence of the field.
  #
  # The FK target is tenants.tenant_id (the public derived key the JWT claim carries), not
  # tenants.id — so the isolation filter needs no lookup on every read.
  - name: TenantID
    type: id
    column: tenant_id
    livesOn: root
    example: a3f1c07e-2b58-5d94-8e61-4f2093ab77d5
    description: >-
      The tenant that owns this role. Immutable after creation — a role never moves
      between tenants.
    labelKey: RoleTenantIDField
    text:
      eng: Tenant ID
      ptbr: ID do tenant
      esp: ID de tenant
      fra: ID de locataire
      deu: Mandanten-ID
      ita: ID tenant
      nld: Tenant-ID

  # The stable machine handle. Unique PER TENANT, never globally: two customers may both
  # call a role `administrator`, which is exactly what unique.within exists for.
  # active-only, so an archived role frees its handle — consistent with the archive being
  # one-way here.
  - name: Key
    type: string
    # The physical column carries a role_ prefix: `key` is a reserved word (the union
    # across the five engines). The EXPOSED name is untouched, so every filter, orderBy
    # token, OpenAPI parameter and GraphQL argument still says key.
    column: role_key
    length: 64
    livesOn: root
    vo: {kind: manual, ref: RoleKey}
    unique:
      enforce: service-precheck+constraint
      notification: RoleKeyAlreadyExistsNotification
      scope: active-only
      within: [TenantID]
    example: billing-manager
    description: >-
      Stable machine handle of the role, unique within its tenant and immutable. What an
      API caller and an audit line reference; never the display name.
    labelKey: RoleKeyField
    text:
      eng: Key
      ptbr: Chave
      esp: Clave
      fra: Clé
      deu: Schlüssel
      ita: Chiave
      nld: Sleutel

  - name: Name
    type: string
    column: name
    length: 120
    livesOn: root
    vo: {kind: reuse, ref: DisplayName}
    example: Billing Manager
    description: >-
      Human-readable name of the role as operators and end users see it. Not unique — two
      tenants, or two roles, may share a label.
    labelKey: RoleNameField
    text:
      eng: Name
      ptbr: Nome
      esp: Nombre
      fra: Nom
      deu: Name
      ita: Nome
      nld: Naam

  - name: Description
    type: string
    column: description
    length: 500
    livesOn: root
    vo: {kind: reuse, ref: Description}
    example: >-
      Grants read access to the tenant registry and the permission catalog, without any
      write verb.
    description: >-
      What holding this role actually lets a user do, in the tenant's own words.
    labelKey: RoleDescriptionField
    text:
      eng: Description
      ptbr: Descrição
      esp: Descripción
      fra: Description
      deu: Beschreibung
      ita: Descrizione
      nld: Beschrijving

valueObjects:
  # kind: manual — the rule is neither a shape nor a closed set. It is the project's
  # lowercase-slug pattern PLUS the shared anti-junk predicates from text_predicates.go
  # (distinctRunes, hasRunOfIdenticalRunes), which no regex states. Deliberately NOT a
  # reuse of TenantWorkspace: that type carries the platform's reserved-route list and
  # DeriveTenantID(), and reusing it would drag both onto a role.
  - name: RoleKey
    kind: manual
    backing: string
    description: >-
      The stable machine handle of a role: 2-64 runes, a single lowercase slug of letters,
      digits and single hyphens, never leading, trailing or doubled. It carries no
      reserved list and no derivation — it is a handle within one tenant, not a public
      key. The same anti-junk predicates the other human-typed handles use apply, so a
      held key and a one-character masher are refused.

children:
  # The grants. ONE field, and that is the whole entry (spec Q2): the catalog row's id and
  # nothing else. The rendered resource:action pair is deliberately not copied in, so a
  # retired-and-recreated permission needs an explicit re-grant rather than silently
  # re-attaching.
  - name: RolePermission
    plural: Permissions
    table: role_permissions
    parentColumn: role_id
    description: >-
      The permissions a role grants. One row per permission in the bundle, holding nothing
      but the catalog row's id — so a retired-and-recreated permission is never silently
      re-granted, and the pair is never stored twice.
    ownedBy: root
    # per-child, never atomic-replace: a replace-all makes every partial client a silent
    # mass-revoker, and a revocation is the one write here that must never happen by
    # omission.
    editStrategy: per-child
    # A PAIR, not a trio. The entry has no editable field — its single column IS its
    # identity — so "change this grant" would turn entry A into entry B while keeping A's
    # row id, which an audit trail reads as one grant BECOMING another instead of as two
    # events. GRANT and REVOKE are the honest surface.
    operations: [add, remove]
    businessIdentity: [PermissionID]
    # Soft removal, so REVOKE mounts as PATCH .../:childId/archive rather than DELETE. A
    # DELETE that leaves the row behind with a deleted_at stamp is a lying contract.
    softRemove: true
    archivedAt: deleted_at
    duplicateNotification: RoleAlreadyGrantsPermissionNotification
    fields:
      - name: PermissionID
        type: id
        column: permission_id
        # The backstop businessIdentity cannot be: that check sees ONE write, so two
        # concurrent GRANTs of the same permission both pass it and both rows land.
        # active-only, so a revoked grant does not block a fresh one.
        unique:
          enforce: constraint-only
          notification: RoleAlreadyGrantsPermissionNotification
          scope: active-only
        example: 9f14b0a2-6d38-4c5e-b7a1-2e0c5d81f4a3
        description: >-
          The catalog row this grant points at — the id and not the string, so a
          retired-and-recreated permission needs an explicit re-grant.
        labelKey: RolePermissionPermissionIDField
        text:
          eng: Permission
          ptbr: Permissão
          esp: Permiso
          fra: Permission
          deu: Berechtigung
          ita: Permesso
          nld: Permissie

notifications:
  - name: RoleKeyAlreadyExistsNotification
    semantic: conflict
    description: >-
      The tenant already has an ACTIVE role under this key. An archived one does not
      collide — the archive is one-way, so re-inserting is how a retired handle comes back.
    text:
      eng: This tenant already has a role with this key.
      ptbr: Este tenant já possui um papel com esta chave.
      esp: Este tenant ya tiene un rol con esta clave.
      fra: Ce locataire possède déjà un rôle avec cette clé.
      deu: Dieser Mandant hat bereits eine Rolle mit diesem Schlüssel.
      ita: Questo tenant ha già un ruolo con questa chiave.
      nld: Deze tenant heeft al een rol met deze sleutel.

  - name: RoleKeyIsImmutableNotification
    semantic: validation
    description: >-
      An attempt to change the role's key, which is what API callers and audit lines
      reference.
    text:
      eng: The role key cannot be changed.
      ptbr: A chave do papel não pode ser alterada.
      esp: La clave del rol no se puede modificar.
      fra: La clé du rôle ne peut pas être modifiée.
      deu: Der Rollenschlüssel kann nicht geändert werden.
      ita: La chiave del ruolo non può essere modificata.
      nld: De rolsleutel kan niet worden gewijzigd.

  - name: RoleTenantIsImmutableNotification
    semantic: validation
    description: An attempt to move a role from one tenant to another.
    text:
      eng: The role's tenant cannot be changed.
      ptbr: O tenant do papel não pode ser alterado.
      esp: El tenant del rol no se puede modificar.
      fra: Le locataire du rôle ne peut pas être modifié.
      deu: Der Mandant der Rolle kann nicht geändert werden.
      ita: Il tenant del ruolo non può essere modificato.
      nld: De tenant van de rol kan niet worden gewijzigd.

  - name: RoleTenantDoesNotExistNotification
    semantic: validation
    description: >-
      The owner tenant is unknown or archived. A role under a dead tenant would be
      grantable and unreachable at once.
    text:
      eng: The tenant does not exist or is no longer active.
      ptbr: O tenant não existe ou não está mais ativo.
      esp: El tenant no existe o ya no está activo.
      fra: Le locataire n'existe pas ou n'est plus actif.
      deu: Der Mandant existiert nicht oder ist nicht mehr aktiv.
      ita: Il tenant non esiste o non è più attivo.
      nld: De tenant bestaat niet of is niet langer actief.

  - name: PermissionNotInCatalogNotification
    semantic: validation
    description: >-
      A granted permission is not in the catalog, or is archived. Granting a retired
      permission would re-attach a role to a row nobody re-approved.
    text:
      eng: This permission is not in the catalog, or is no longer active.
      ptbr: Esta permissão não está no catálogo, ou não está mais ativa.
      esp: Este permiso no está en el catálogo, o ya no está activo.
      fra: Cette permission n'est pas au catalogue, ou n'est plus active.
      deu: Diese Berechtigung ist nicht im Katalog oder nicht mehr aktiv.
      ita: Questo permesso non è nel catalogo, o non è più attivo.
      nld: Deze permissie staat niet in de catalogus, of is niet langer actief.

  - name: RoleAlreadyGrantsPermissionNotification
    semantic: conflict
    description: >-
      The role already grants this permission. Storing the pair twice would make a single
      revocation leave the grant standing.
    text:
      eng: This role already grants this permission.
      ptbr: Este papel já concede esta permissão.
      esp: Este rol ya concede este permiso.
      fra: Ce rôle accorde déjà cette permission.
      deu: Diese Rolle gewährt diese Berechtigung bereits.
      ita: Questo ruolo concede già questo permesso.
      nld: Deze rol verleent deze permissie al.

  - name: TooManyPermissionsInRoleNotification
    semantic: validation
    tvars: [max]
    description: >-
      The role bundles more permissions than one role is allowed to carry. The cap is a
      claim-size budget as much as a modelling one.
    text:
      eng: A role may grant at most {max} permissions.
      ptbr: Um papel pode conceder no máximo {max} permissões.
      esp: Un rol puede conceder como máximo {max} permisos.
      fra: Un rôle peut accorder au maximum {max} permissions.
      deu: Eine Rolle darf höchstens {max} Berechtigungen gewähren.
      ita: Un ruolo può concedere al massimo {max} permessi.
      nld: Een rol mag maximaal {max} permissies verlenen.

  - name: CannotGrantUnheldPermissionNotification
    semantic: forbidden
    description: >-
      The caller tried to grant a permission they do not themselves hold — the classic
      privilege-escalation move. A *:* super-admin passes for everything, by construction.
    text:
      eng: You cannot grant a permission you do not hold.
      ptbr: Você não pode conceder uma permissão que não possui.
      esp: No puede conceder un permiso que usted no posee.
      fra: Vous ne pouvez pas accorder une permission que vous ne détenez pas.
      deu: Sie können keine Berechtigung gewähren, die Sie nicht selbst besitzen.
      ita: Non puoi concedere un permesso che non possiedi.
      nld: U kunt geen permissie verlenen die u zelf niet heeft.

  - name: CannotGrantWildcardPermissionNotification
    semantic: forbidden
    description: >-
      A wildcard permission cannot be granted on any role through the API. It also keeps
      every wildcard string away from Identity.HasPermission, which panics on one.
    text:
      eng: A wildcard permission cannot be granted on a role.
      ptbr: Uma permissão curinga não pode ser concedida em um papel.
      esp: Un permiso comodín no puede concederse en un rol.
      fra: Une permission joker ne peut pas être accordée sur un rôle.
      deu: Eine Platzhalter-Berechtigung kann keiner Rolle gewährt werden.
      ita: Un permesso jolly non può essere concesso a un ruolo.
      nld: Een jokerpermissie kan niet aan een rol worden verleend.

  # Raised by the hand-written vos.RoleKey, so it lives in the vos package.
  - name: InvalidRoleKeyNotification
    package: vos
    semantic: validation
    description: >-
      A role key outside the accepted shape — not a single lowercase slug, or one that
      reads as keyboard junk.
    text:
      eng: The role key must be a single lowercase slug of 2 to 64 characters.
      ptbr: A chave do papel deve ser um único slug minúsculo de 2 a 64 caracteres.
      esp: La clave del rol debe ser un único slug en minúsculas de 2 a 64 caracteres.
      fra: La clé du rôle doit être un seul slug minuscule de 2 à 64 caractères.
      deu: Der Rollenschlüssel muss ein einzelner Kleinbuchstaben-Slug mit 2 bis 64 Zeichen sein.
      ita: La chiave del ruolo deve essere un singolo slug minuscolo da 2 a 64 caratteri.
      nld: De rolsleutel moet één kleine slug van 2 tot 64 tekens zijn.

# One-way archive, no unarchive: a role is granted to users and groups, and those grants
# point at the role's id, which does not change. A single /unarchive would therefore
# silently re-authorize every user who still holds it, with no re-approval and an audit
# line reading "restored". A retired role comes back as a NEW row that must be granted
# again. No delete: a purge destroys the only human-readable record of what a past grant
# meant, which is exactly what an access review reads.
modes: [display, insert, update, archive]

update:
  shape: patch
  # Structural immutability. The rules below are the belt-and-braces layer over the same
  # two facts.
  patchExcludes: [Key, TenantID]

delete:
  root: soft

rules:
  list:
    # Presence, format and the closed-set questions are NOT declared here: all three text
    # fields are value-object backed and the framework validates those on every write.
    # Tenant isolation (R5) is not here either — authz.dataAccess generates both halves.
    - id: role-key-immutable
      kind: immutable
      scope: [update]
      fields: [Key]
      notification: RoleKeyIsImmutableNotification
      description: >-
        The key is what API callers and audit lines reference; changing it rewrites what
        every past reference meant, retroactively and invisibly.

    - id: role-tenant-immutable
      kind: immutable
      scope: [update]
      fields: [TenantID]
      notification: RoleTenantIsImmutableNotification
      description: >-
        A role never moves between tenants; moving one would hand a customer's grants to
        another customer in a single write.

    - id: role-no-duplicate-permission
      kind: childDuplicate
      scope: [insertOrUpdate]
      fields: [RolePermission]
      notification: RoleAlreadyGrantsPermissionNotification
      description: >-
        Storing the same permission twice would make a single revocation leave the grant
        standing.

    - id: role-permission-cap
      kind: groupCap
      scope: [insertOrUpdate]
      fields: [RolePermission]
      cap: 200
      notification: TooManyPermissionsInRoleNotification
      description: >-
        The cap is over the WHOLE collection — the number of permissions one role bundles,
        with no grouping and no restriction. It is a claim-size budget as much as a
        modelling one: the permission spec sizes one rendered entry at 129 runes, so 200
        is sized to this platform rather than to GCP's 3000 or Azure's 2000.

  manual:
    # THE THREE GRANT RULES BELOW JUDGE THE ENTRIES A WRITE ADDS, never the ones
    # already stored (spec.md §7, "What these three rules judge"; tasks.md D6). All
    # three ask about the ACT of granting, and a stored grant was asked all three when
    # it entered — re-asking them makes unrelated writes hostages of the past: a
    # permission retired AFTER the grant makes the role impossible to rename, and a
    # caller who has since lost a permission can no longer even REVOKE the others.
    # Mechanically domain.GetAddedItemsOf, not GetCurrentItemsOf. An insert is
    # unchanged: every entry of a new role is an added one.
    - id: tenant-must-be-active
      description: >-
        The owner tenant must exist and not be archived. Ask the TenantIsUnavailable fact
        with the role's TenantID; when it answers true, refuse. On insert only — the
        tenant is immutable afterwards, so a later archive of the tenant must not freeze
        edits to roles that already exist under it.
      scope: [insert]
      notification: RoleTenantDoesNotExistNotification
      attachTo: TenantID

    # R9b runs BEFORE R9a and exists to remove the panic input. Identity.HasPermission
    # panics on any argument containing '*', so the naive "ask HasPermission for each
    # granted key" crashes the request into a 500 the moment somebody tries to grant the
    # *:* catalog row — precisely the case the no-escalation rule exists to stop.
    - id: no-wildcard-grant
      description: >-
        No granted permission may carry a wildcard in either part. For each entry this
        write ADDS to Permissions, ask the PermissionIsWildcard fact with the entry's
        PermissionID and refuse when it answers true. This rule MUST be evaluated before
        caller-must-hold-granted-permission, and is what guarantees no wildcard string
        ever reaches Identity.HasPermission, which panics on one. Consequence, accepted:
        the platform's own *:* role is seeded by migration beside the reserved platform
        tenant, not created through this API.
      scope: [insertOrUpdate]
      notification: CannotGrantWildcardPermissionNotification
      attachTo: Permissions

    - id: granted-permission-must-be-in-catalog
      description: >-
        Every granted permission must exist in the catalog and be active. For each entry
        this write ADDS to Permissions, ask the PermissionIsNotInCatalog fact with the
        entry's PermissionID and refuse when it answers true. The database foreign key already
        guarantees EXISTENCE; this rule earns its keep for the ACTIVE half, and for
        turning a violation into a readable 422 instead of a raw constraint error.
      scope: [insertOrUpdate]
      notification: PermissionNotInCatalogNotification
      attachTo: Permissions

    - id: caller-must-hold-granted-permission
      description: >-
        No privilege escalation: a caller may only grant a permission they themselves
        hold. For each entry this write ADDS to Permissions, ask the
        CallerDoesNotHoldPermission fact with the entry's PermissionID and refuse when it
        answers true. Evaluate this AFTER
        no-wildcard-grant, so every key reaching it is concrete. A *:* super-admin needs
        no special case — Identity.HasPermission answers true for any concrete permission
        when the claim set carries *:*. TWO absent states, and collapsing them breaks one
        profile or the other: no Identity at all (auth.mode: disabled, dev only) means
        this rule stands down; an Identity present whose claim is empty or insufficient is
        REFUSED, fail closed.
      scope: [insertOrUpdate]
      notification: CannotGrantUnheldPermissionNotification
      attachTo: Permissions

service:
  required: true
  facts:
    # Every fact below is named for the PROBLEM, never for the healthy state: the
    # generated suite stubs the service so each probe answers "nothing found", which is
    # what lets the valid fixture through. A fact spelled TenantIsActive would read false
    # under that stub and mean "the tenant is gone", turning a correct spec red on the day
    # it is written.
    - name: RoleKeyTaken
      kind: exists
      # Exactly unique.within + the field, in both directions. A handle is unique PER
      # TENANT: get this wrong and the precheck asks per tenant while the index enforces
      # globally, reporting "already taken" for a tenant where it is free — on exactly the
      # handles two customers both pick (administrator, owner, viewer).
      filters: [TenantID, Key]
      excludeSelf: true
      activeOnly: true
      description: >-
        Whether this tenant already has an ACTIVE role under this key.

    - name: TenantIsUnavailable
      kind: manual
      returns: bool
      filters: [TenantID]
      description: >-
        Whether the owner tenant is unknown or archived. Not answerable from this
        entity's own table — it is a question about the tenants table, so the
        implementation holds the tenant repository beside its own.

    - name: PermissionIsNotInCatalog
      kind: manual
      returns: bool
      filters: [Permissions.PermissionID]
      description: >-
        Whether this granted permission is absent from the catalog or archived. Asked once
        per entry. Not answerable declaratively — the column lives on the permissions
        table, not on this entity's.

    - name: PermissionIsWildcard
      kind: manual
      returns: bool
      filters: [Permissions.PermissionID]
      description: >-
        Whether the catalog row this grant points at carries a wildcard in either part.
        Asked once per entry, and answered by resolving the id to its vos.PermissionKey.
        It is what keeps every wildcard string away from Identity.HasPermission, which
        panics on one — so it must answer TRUE for an unknown id too, rather than let an
        unresolvable grant fall through to the caller-holds question.

    - name: CallerDoesNotHoldPermission
      kind: manual
      returns: bool
      filters: [Permissions.PermissionID]
      description: >-
        Whether the authenticated caller lacks the permission this grant points at. Asked
        once per entry, and only for concrete keys — no-wildcard-grant has already
        refused the wildcards. Implementation: resolve the id to its key; return false
        when ctx.Identity() is nil (auth disabled, dev only) so the rule stands down;
        otherwise answer NOT Identity.HasPermission(key). Guard the wildcard here as well
        and answer true rather than calling through — a panic on a security rule is a 500.

read:
  backing: relational
  view:
    name: roles
    version: 1
    maxLimit: 200
  byId: true
  byParams:
    filters:
      - {field: TenantID, ops: [eq, in]}
      - {field: Key, ops: [eq, ne, in, startswith, istartswith, contains, icontains]}
      - {field: Name, ops: [eq, in, startswith, istartswith, contains, icontains]}
      - {field: Description, ops: [contains, icontains]}
    # The ordering VOCABULARY. Description is deliberately absent: ordering a listing by a
    # 500-char free-text column is a blocking sort nobody asks for on purpose.
    sort: [TenantID, Key, Name]
    controls:
      pagination: true
      orderBy: true
      fields: true
      onlyTotal: true
      # A retired role must stay auditable, and with no unarchive verb this listing is the
      # only way to see one.
      includeArchived: true
      # search is deliberately absent: a relational-served view answers free text with a
      # typed 400, and filter[name][icontains] covers the real need.

surfaces:
  rest: true
  graphql:
    enabled: true
    connection: true
    # No unarchive mutation: the verb does not exist on this aggregate.
    mutations: [insert, update, archive]
  # No CSV/XLSX exports: operator-facing and small. An access-review export is the
  # plausible reason to want one later; it is one flag.

authz:
  resource: role
  # Every row is tenant-scoped, on READS and on WRITES both (spec Q4). This generates the
  # read filter in the query AND the guard in BuildRules under every write gate.
  dataAccess: tenant
  tenantField: TenantID
  # A *:* super-admin crosses the scope, so a platform operator can support a customer.
  # Spelled as the wildcard itself rather than as a mintable permission: the approved
  # policy was "a super-admin crosses the tenant", and minting a permission would widen
  # it. The generated guard calls Identity.IsSuperAdmin() — HasPermission panics on a
  # wildcard.
  bypass: "*:*"
  # stand-down: the scope applies to every authenticated caller and steps aside only where
  # there is nobody to scope to. That state is confined to auth.mode: disabled, which the
  # framework refuses outside APP_PROFILE=dev — so a token that simply carries no tenant
  # claim is still refused, while the dev bench stays usable.
  noIdentity: stand-down
  permissions:
    insert: role:insert
    patch: role:update
    archive: role:archive
    read: role:read
