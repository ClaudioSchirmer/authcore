# Tenant — the isolation partition every other aggregate of this service hangs off.
#
# Model authority: scaffold-entity/tenant/spec.md (Status: APPROVED). Nothing here
# re-decides the model; where this file and that spec disagree, the spec wins.
#
# Three identifiers, each with exactly one job:
#   id         UUIDv7, framework-minted. Internal. Referenced by nothing.
#   workspace  the human-facing handle — URLs, logs, support. Immutable, never reused.
#   tenant_id  UUIDv5(namespace, workspace). The PUBLIC key: the tenant_id token claim
#              and the FK target of every future aggregate. Server-derived, so it is
#              absent from every write DTO.
#
# Discovered from the project: dialect postgres · read backing relational.

specVersion: 1
entity: Tenant
plural: Tenants
language: en-US

storage:
  kind: flat
  table: tenants
  description: >-
    Isolation partitions of the platform. tenant_id is the public key — derived from
    workspace, issued as the tenant_id token claim, and the target of every foreign key;
    the id column is a framework surrogate and is never issued to anyone.
  managed:
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # The public key. assignedFrom: derived keeps it out of every write request, command
  # and OpenAPI request schema — a caller never proposes it. The derivation itself is
  # owed as a rules.manual entry scoped to insert (see rules.manual below).
  - name: TenantID
    type: id
    column: tenant_id
    livesOn: root
    assignedFrom: derived
    unique:
      enforce: constraint-only
      notification: TenantIDAlreadyExistsNotification
      scope: all
    example: a3f1c07e-2b58-5d94-8e61-4f2093ab77d5
    description: >-
      Public key of the tenant, derived from workspace. Issued as the tenant_id claim of
      every token and referenced by every tenant-scoped aggregate.
    labelKey: TenantTenantIDField
    text:
      eng: Tenant ID
      ptbr: ID do tenant
      esp: ID de tenant
      fra: ID de locataire
      deu: Mandanten-ID
      ita: ID tenant
      nld: Tenant-ID

  - name: Name
    type: string
    column: name
    length: 120
    livesOn: root
    vo: {kind: manual, ref: DisplayName}
    example: Acme Comércio e Serviços Ltda
    description: >-
      Human-readable display name of the tenant organization, as operators and end users
      see it. Not unique — two genuinely different customers may share a name.
    labelKey: TenantNameField
    text:
      eng: Name
      ptbr: Nome
      esp: Nombre
      fra: Nom
      deu: Name
      ita: Nome
      nld: Naam

  - name: Workspace
    type: string
    column: workspace
    length: 63
    livesOn: root
    vo: {kind: manual, ref: TenantWorkspace}
    unique:
      enforce: service-precheck+constraint
      notification: TenantWorkspaceAlreadyExistsNotification
      # all, never active-only: an archived remnant MUST keep blocking the handle,
      # because tenant_id is a pure function of it and reuse would mint a colliding key.
      scope: all
    example: acme-comercio
    description: >-
      Immutable handle of the tenant; reaches URLs, logs and external configuration, and
      is the input the public tenant_id is derived from. Never reused, archived rows
      included.
    labelKey: TenantWorkspaceField
    text:
      eng: Workspace
      ptbr: Workspace
      esp: Workspace
      fra: Workspace
      deu: Workspace
      ita: Workspace
      nld: Workspace

  - name: Description
    type: string
    column: description
    length: 500
    livesOn: root
    vo: {kind: manual, ref: Description}
    example: Retail operations of the Acme group in Brazil.
    description: What this tenant is, in the platform operators' own words.
    labelKey: TenantDescriptionField
    text:
      eng: Description
      ptbr: Descrição
      esp: Descripción
      fra: Description
      deu: Beschreibung
      ita: Descrizione
      nld: Beschrijving

  - name: Status
    type: string
    column: status
    length: 20
    livesOn: root
    vo: {kind: enum, ref: TenantStatus}
    example: active
    description: >-
      Commercial lifecycle of the tenant. Orthogonal to archiving — a suspended tenant is
      still listed and still authenticates for billing.
    labelKey: TenantStatusField
    text:
      eng: Status
      ptbr: Situação
      esp: Estado
      fra: Statut
      deu: Status
      ita: Stato
      nld: Status

valueObjects:
  # The three text value objects are `manual`: their rule is anti-junk composition —
  # distinct-rune counts, no run of 4 identical runes, Unicode word and vowel tests —
  # which no regex in RE2 can say (no backreferences) and no member list can close.
  # DisplayName and Description are SHARED (Group/Role will reuse them); TenantWorkspace
  # is entity-specific because it carries the reserved list and DeriveTenantID().
  - name: DisplayName
    kind: manual
    backing: string
    description: >-
      A human-typed display name of a thing (not a person): 2 to 120 runes, at least one
      letter, at least min(3, length) distinct runes, no run of 4 or more identical runes,
      trimmed and single-spaced. No word count — single-word company names are ordinary.

  - name: Description
    kind: manual
    backing: string
    description: >-
      A human-typed description: 15 to 500 runes, at least two words (a word is a run of
      2 or more Unicode letters), at least 5 distinct runes, no run of 4 or more identical
      runes, and at least one vowel — where any letter outside the Latin script counts as
      one, so a non-Latin description is never rejected as junk.

  - name: TenantWorkspace
    kind: manual
    backing: string
    description: >-
      The tenant's DNS-label handle: 3 to 63 runes matching ^[a-z0-9]+(-[a-z0-9]+)*$, at
      least 3 distinct runes, no run of 4 or more identical runes, and not a member of the
      reserved list (platform routes and phishing-prone words). No normalization — a value
      that does not already comply is refused, never quietly repaired. It also carries
      DeriveTenantID(), the UUIDv5 derivation that produces the tenant's public key.

  - name: TenantStatus
    kind: enum
    backing: string
    description: The commercial lifecycle state of a tenant.
    unknownNotification: UnknownTenantStatusNotification
    members:
      - name: Trial
        value: trial
        text: {eng: Trial, ptbr: Avaliação, esp: Prueba, fra: Essai, deu: Testphase, ita: Prova, nld: Proefperiode}
      - name: Active
        value: active
        text: {eng: Active, ptbr: Ativo, esp: Activo, fra: Actif, deu: Aktiv, ita: Attivo, nld: Actief}
      - name: Suspended
        value: suspended
        text: {eng: Suspended, ptbr: Suspenso, esp: Suspendido, fra: Suspendu, deu: Gesperrt, ita: Sospeso, nld: Opgeschort}

notifications:
  - name: TenantWorkspaceAlreadyExistsNotification
    semantic: conflict
    description: The workspace handle is already held by another tenant, archived ones included.
    text:
      eng: This workspace is already taken.
      ptbr: Este workspace já está em uso.
      esp: Este workspace ya está en uso.
      fra: Ce workspace est déjà utilisé.
      deu: Dieser Workspace ist bereits vergeben.
      ita: Questo workspace è già in uso.
      nld: Deze workspace is al in gebruik.

  - name: TenantIDAlreadyExistsNotification
    semantic: conflict
    description: The derived public key already exists — structurally implied by the workspace conflict.
    text:
      eng: A tenant with this tenant ID already exists.
      ptbr: Já existe um tenant com este ID de tenant.
      esp: Ya existe un tenant con este ID de tenant.
      fra: Un locataire avec cet ID existe déjà.
      deu: Ein Mandant mit dieser Mandanten-ID existiert bereits.
      ita: Esiste già un tenant con questo ID.
      nld: Er bestaat al een tenant met dit tenant-ID.

  - name: UnknownTenantStatusNotification
    package: vos
    semantic: validation
    description: A status outside the closed set trial | active | suspended.
    text:
      eng: Unknown tenant status.
      ptbr: Situação de tenant desconhecida.
      esp: Estado de tenant desconocido.
      fra: Statut de locataire inconnu.
      deu: Unbekannter Mandantenstatus.
      ita: Stato del tenant sconosciuto.
      nld: Onbekende tenantstatus.

  - name: InvalidDisplayNameNotification
    package: vos
    semantic: validation
    description: A display name that is too short, too long, or reads as keyboard junk.
    text:
      eng: The name is not a valid display name.
      ptbr: O nome não é um nome de exibição válido.
      esp: El nombre no es un nombre visible válido.
      fra: Le nom n'est pas un nom d'affichage valide.
      deu: Der Name ist kein gültiger Anzeigename.
      ita: Il nome non è un nome visualizzato valido.
      nld: De naam is geen geldige weergavenaam.

  - name: InvalidDescriptionNotification
    package: vos
    semantic: validation
    description: A description that is too short, too long, or reads as keyboard junk.
    text:
      eng: The description is not valid.
      ptbr: A descrição não é válida.
      esp: La descripción no es válida.
      fra: La description n'est pas valide.
      deu: Die Beschreibung ist ungültig.
      ita: La descrizione non è valida.
      nld: De beschrijving is niet geldig.

  - name: InvalidTenantWorkspaceNotification
    package: vos
    semantic: validation
    description: A workspace handle outside the accepted DNS-label shape.
    text:
      eng: The workspace must be 3 to 63 characters of lowercase letters, digits and hyphens.
      ptbr: O workspace deve ter de 3 a 63 caracteres entre letras minúsculas, dígitos e hífens.
      esp: El workspace debe tener de 3 a 63 caracteres entre letras minúsculas, dígitos y guiones.
      fra: Le workspace doit comporter de 3 à 63 caractères parmi lettres minuscules, chiffres et tirets.
      deu: Der Workspace muss aus 3 bis 63 Zeichen aus Kleinbuchstaben, Ziffern und Bindestrichen bestehen.
      ita: Il workspace deve avere da 3 a 63 caratteri tra lettere minuscole, cifre e trattini.
      nld: De workspace moet 3 tot 63 tekens bevatten uit kleine letters, cijfers en koppeltekens.

  - name: ReservedTenantWorkspaceNotification
    package: vos
    semantic: validation
    description: A workspace handle that collides with a platform route or a phishing-prone word.
    text:
      eng: This workspace is reserved by the platform.
      ptbr: Este workspace é reservado pela plataforma.
      esp: Este workspace está reservado por la plataforma.
      fra: Ce workspace est réservé par la plateforme.
      deu: Dieser Workspace ist von der Plattform reserviert.
      ita: Questo workspace è riservato dalla piattaforma.
      nld: Deze workspace is gereserveerd door het platform.

  - name: TenantWorkspaceIsImmutableNotification
    semantic: validation
    description: An attempt to change the workspace handle, which derives the public key.
    text:
      eng: The workspace cannot be changed.
      ptbr: O workspace não pode ser alterado.
      esp: El workspace no se puede modificar.
      fra: Le workspace ne peut pas être modifié.
      deu: Der Workspace kann nicht geändert werden.
      ita: Il workspace non può essere modificato.
      nld: De workspace kan niet worden gewijzigd.

  - name: TenantIDIsImmutableNotification
    semantic: validation
    description: An attempt to change the derived public key.
    text:
      eng: The tenant ID cannot be changed.
      ptbr: O ID do tenant não pode ser alterado.
      esp: El ID de tenant no se puede modificar.
      fra: L'ID de locataire ne peut pas être modifié.
      deu: Die Mandanten-ID kann nicht geändert werden.
      ita: L'ID del tenant non può essere modificato.
      nld: Het tenant-ID kan niet worden gewijzigd.

  - name: TenantIDDerivationMismatchNotification
    semantic: validation
    description: The stored public key does not match the one the workspace derives.
    text:
      eng: The tenant ID does not match the one derived from the workspace.
      ptbr: O ID do tenant não corresponde ao derivado do workspace.
      esp: El ID de tenant no coincide con el derivado del workspace.
      fra: L'ID de locataire ne correspond pas à celui dérivé du workspace.
      deu: Die Mandanten-ID stimmt nicht mit der aus dem Workspace abgeleiteten überein.
      ita: L'ID del tenant non corrisponde a quello derivato dal workspace.
      nld: Het tenant-ID komt niet overeen met het uit de workspace afgeleide ID.

  - name: TenantDescriptionMustDifferNotification
    semantic: validation
    description: A description that merely repeats the name or the workspace handle.
    text:
      eng: The description must say something other than the name or the workspace.
      ptbr: A descrição deve dizer algo além do nome ou do workspace.
      esp: La descripción debe decir algo más que el nombre o el workspace.
      fra: La description doit dire autre chose que le nom ou le workspace.
      deu: Die Beschreibung muss mehr aussagen als der Name oder der Workspace.
      ita: La descrizione deve dire qualcosa di diverso dal nome o dal workspace.
      nld: De beschrijving moet meer zeggen dan de naam of de workspace.

  - name: InvalidTenantStatusTransitionNotification
    semantic: validation
    description: A commercial status change that the lifecycle does not allow — notably any return to trial.
    text:
      eng: The tenant cannot move to that status.
      ptbr: O tenant não pode ir para essa situação.
      esp: El tenant no puede pasar a ese estado.
      fra: Le locataire ne peut pas passer à ce statut.
      deu: Der Mandant kann nicht in diesen Status wechseln.
      ita: Il tenant non può passare a questo stato.
      nld: De tenant kan niet naar die status.

modes: [display, insert, update, archive, unarchive]

update:
  shape: patch
  # Structural immutability: the handle is not a member of the partial body at all.
  # Rule workspace-immutable below is the belt-and-braces layer over the same fact.
  patchExcludes: [Workspace]

delete:
  # Soft only. No DELETE verb: purging a tenant would orphan live tokens and every
  # future foreign key, and would release the workspace that reserves the public key.
  root: soft

rules:
  list:
    # Presence, format and closed-set checks are NOT declared here: every field above is
    # value-object backed, and the framework validates those on every write by itself.
    - id: workspace-immutable
      kind: immutable
      scope: [update]
      fields: [Workspace]
      notification: TenantWorkspaceIsImmutableNotification
      echoValue: true
      description: A changed workspace changes tenant_id, orphaning every live token and FK.

    - id: tenant-id-immutable
      kind: immutable
      scope: [update]
      fields: [TenantID]
      notification: TenantIDIsImmutableNotification
      description: The public key is derived once, at creation, and never moves.

    - id: status-transition
      kind: transition
      scope: [update]
      fields: [Status]
      transitions:
        trial: [active, suspended]
        active: [suspended]
        suspended: [active]
      notification: InvalidTenantStatusTransitionNotification
      description: A trial is a beginning — no tenant returns to it.

  manual:
    - id: derive-tenant-id
      description: >-
        On insert, set TenantID to Workspace.DeriveTenantID() — the UUIDv5 of the service's
        TenantIDNamespace over the workspace handle. The field is server-derived and reaches
        no write DTO, so this is the only place the value is ever produced.
      scope: [insert]

    - id: tenant-id-matches-workspace
      description: >-
        TenantID must equal Workspace.DeriveTenantID(). The value is computed by the rule
        above, so this can only fail through a bug in that derivation or a hand-written row —
        which is exactly what it guards.
      scope: [insertOrUpdate]
      notification: TenantIDDerivationMismatchNotification
      attachTo: TenantID

    - id: description-differs-from-name-and-workspace
      description: >-
        The description must differ from both Name and Workspace under a normalized
        comparison — case-folded, with whitespace and hyphens collapsed — which catches the
        pasted-name description.
      scope: [insertOrUpdate]
      notification: TenantDescriptionMustDifferNotification
      attachTo: Description

    - id: archive-forces-suspended
      description: >-
        Archiving forces Status to suspended. This is a MUTATION, not a validation: set the
        field and raise nothing. An archived tenant is never commercially active, so
        archived+active becomes an unrepresentable state, and unarchiving brings the tenant
        back suspended by consequence.
      scope: [archive]

service:
  required: true
  facts:
    - name: WorkspaceTaken
      kind: exists
      field: Workspace
      filters: [Workspace]
      # An update must not collide with itself.
      excludeSelf: true
      # activeOnly is deliberately OFF: an ARCHIVED tenant still holds its workspace
      # forever, because tenant_id is a pure function of it and reuse would mint a
      # byte-identical public key.
      activeOnly: false
      description: >-
        Whether any tenant, archived ones included, already holds this workspace handle.

read:
  backing: relational
  view:
    name: tenants
    version: 1
    maxLimit: 200
  byId: true
  byParams:
    filters:
      - {field: TenantID, ops: [eq, in]}
      - {field: Name, ops: [eq, in, startswith, contains, istartswith, icontains]}
      - {field: Workspace, ops: [eq, in, startswith, istartswith]}
      - {field: Description, ops: [contains, icontains]}
      - {field: Status, ops: [eq, in]}
      # CreatedAt / UpdatedAt are NOT declarable filters: this build serves filters only
      # over declared entity fields, and the managed timestamps are not among them.
      # spec.md §9 asked for range filters on both — recorded as a deviation there.
    sort: [TenantID, Workspace]
    controls:
      pagination: true
      orderBy: true
      fields: true
      onlyTotal: true
      # Archived tenants must stay reachable: archiving is the only removal there is.
      includeArchived: true
      # search is deliberately absent — a relational-served view answers free-text search
      # with a typed 400, and declaring it would promise what this posture cannot serve.

surfaces:
  rest: true
  graphql:
    enabled: true
    connection: true
    mutations: [insert, update, archive, unarchive]
  # No CSV/XLSX exports.

authz:
  resource: tenant
  # A platform registry: tenant:insert is already a platform-level operation, and the
  # tenant_id claim the alternatives would filter on does not exist yet.
  dataAccess: anyone-with-permission
  permissions:
    insert: tenant:insert
    patch: tenant:update
    archive: tenant:archive
    unarchive: tenant:archive
    read: tenant:read
