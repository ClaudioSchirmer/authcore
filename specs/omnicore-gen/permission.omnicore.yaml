# Permission — the global catalog of enforceable permissions.
#
# Model authority: scaffold-entity/permission/spec.md (Status: APPROVED). Nothing here
# re-decides the model; where this file and that spec disagree, the spec wins.
#
# The one idea to hold while reading: THREE COLUMNS GO IN, TWO GO OUT.
#   resource_name  stored · filterable · sortable · NOT on the wire
#   action_name    stored · filterable · sortable · NOT on the wire
#   description    stored · filterable · sortable · on the wire
#   permission     no column at all — DERIVED per row as `resource:action`, the exact
#                  string a JWT claim carries and RequirePermission(...) compares against
#
# Filtering and ordering are declared on the Request DTO and never consult the Response,
# which is what lets the two hidden parts stay queryable while leaving no value on the wire.
#
# Discovered from the project: dialect postgres · read backing relational.

specVersion: 1
entity: Permission
plural: Permissions
language: en-US

storage:
  kind: flat
  table: permissions
  description: >-
    The global catalog of enforceable permissions. One row per resource:action pair some
    route enforces; defined by the platform, never by a tenant. The resource:action string
    is rendered on read, never stored.
  managed:
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # The permission itself — ONE concept across TWO columns, which is exactly when several
  # columns are one value object rather than two fields: `read` alone is not a permission
  # and `tenant` alone is not one either.
  #
  # The `_name` column suffix is deliberate: `resource` is a RESERVED WORD on oracle and
  # identifiers are not always emitted quoted, so the physical column carries the suffix and
  # `action` follows it rather than leaving the pair asymmetric. The EXPOSED names are
  # untouched — no `as:` — so every filter, ?orderBy token, OpenAPI parameter, GraphQL
  # argument and audit entry still says Resource and Action.
  #
  # hidden: STORED, filterable, sortable, writable — and in no response body, on any
  # surface. The caller receives the rendered `permission` instead (read.computed below),
  # which derives FROM these two. That is the shape `hidden` exists for.
  #
  # unique on a COMPOSITE is uniqueness over the TUPLE: one multi-column constraint plus
  # its 409 binding. scope: active-only, because an archived remnant must not block a fresh
  # pair — with no unarchive verb (modes below), re-inserting is the ONLY way a retired
  # permission comes back.
  # The field is named for the CONCEPT, not for its role in the table. That name is what a
  # rejection puts on the wire: `AddNotification("Permission", …)` renders `field:
  # "permission"`, the same word the read side already answers with (read.computed below)
  # and the same word the label renders. It was `Key` once, which named nothing any request
  # or response carried.
  #
  # echoValue: true — the 409 carries the refused pair back, rendered through
  # PermissionKey.String(). It is off by default on a COMPOSITE because the generator cannot
  # know the owner renders usefully; this one does, and `check` says so in a warning rather
  # than a refusal. Without it the answer says a pair is taken and never says which.
  - name: Permission
    livesOn: root
    hidden: true
    vo: {kind: composite, ref: PermissionKey}
    unique:
      enforce: service-precheck+constraint
      notification: PermissionAlreadyExistsNotification
      echoValue: true
      scope: active-only
    description: >-
      The permission itself: what resource, and what may be done to it. Stored as two
      columns, rendered as one resource:action string.
    # The SAME key the read side's computed field wears. One concept, one label: the two
    # used to be PermissionKeyField and PermissionPermissionField with identical text in all
    # seven catalogs, and that duplication existed only because the write field and the read
    # field were named differently. They no longer are.
    labelKey: PermissionPermissionField
    text:
      eng: Permission
      ptbr: Permissão
      esp: Permiso
      fra: Permission
      deu: Berechtigung
      ita: Permesso
      nld: Recht
    parts:
      - {part: Resource, column: resource_name, length: 64, example: tenant}
      - {part: Action,   column: action_name,   length: 64, example: read}

  - name: Description
    type: string
    column: description
    length: 500
    livesOn: root
    vo: {kind: reuse, ref: Description}
    example: "Read tenants: list the tenant registry and fetch a tenant by id."
    description: >-
      What holding this permission actually lets a caller do, in the platform operators'
      own words.
    labelKey: PermissionDescriptionField
    text:
      eng: Description
      ptbr: Descrição
      esp: Descripción
      fra: Description
      deu: Beschreibung
      ita: Descrizione
      nld: Beschrijving

valueObjects:
  # written: manual — the SHAPE stays declared (the schema decomposes the parts into
  # columns, the mappers fold them, the migration sizes them, the catalogs translate them)
  # and the FILE is ours. It has to be: the pair-level invariant "a `*` resource forces a
  # `*` action" is not required/length/range/comparison/requiredIf, and the segment checks
  # reuse this project's shared anti-junk predicates, which no regex states.
  #
  # It also owns the RENDERING: String() returns resource + ":" + action. Not Value() —
  # that method's ABSENCE is what tells the framework to decompose the value instead of
  # storing a rendering in one column. Nothing else in this service concatenates a resource
  # and an action with a colon.
  #
  # The parts are plain strings, not value objects of their own: both are built from ONE
  # shared segment rule and nothing else in this microservice carries a resource or an
  # action alone, so the composite is that rule's single home.
  - name: PermissionKey
    kind: composite
    written: manual
    description: >-
      A resource together with what may be done to it — the pair a JWT claim carries and a
      route compares against, byte for byte. The resource is a colon-joined path of 2-64
      rune lowercase slugs (tenant, user:profile); the action is exactly one such slug, so
      the LAST colon segment is always the action and the rendering parses back one way.
      The wildcard `*` is accepted as an ENTIRE part only, never inside a path and never
      mixed into a slug, and a `*` resource forces a `*` action — the claim matcher honors
      exactly three shapes (exact, resource:*, *:*) and anything else would be a row that
      matches nothing while reading like a grant. No normalization: a value that does not
      already comply is refused, never repaired.
    parts:
      - name: Resource
        type: string
        description: >-
          The thing being protected, as the enforcing route names it. `*` means every
          resource.
        labelKey: PermissionResourceField
        text:
          eng: Resource
          ptbr: Recurso
          esp: Recurso
          fra: Ressource
          deu: Ressource
          ita: Risorsa
          nld: Resource
      - name: Action
        type: string
        description: >-
          What may be done to the resource. `*` means every action on that resource.
        labelKey: PermissionActionField
        text:
          eng: Action
          ptbr: Ação
          esp: Acción
          fra: Action
          deu: Aktion
          ita: Azione
          nld: Actie

notifications:
  - name: PermissionAlreadyExistsNotification
    semantic: conflict
    description: >-
      An ACTIVE permission already holds this resource and action pair. Archived rows do
      not block it — re-inserting is how a retired permission comes back.
    # The composition is spelled out in every one of these texts on purpose: a caller who
    # reads only the rejection has to be able to tell WHICH half is wrong. The literal
    # "resource:action" is NOT translated — those two words are the JSON keys the request
    # actually carries, in every language, so translating them would point at fields that
    # do not exist.
    text:
      eng: 'A permission is "resource:action" — this pair already exists.'
      ptbr: 'Uma permissão é "resource:action" — este par já existe.'
      esp: 'Un permiso es "resource:action" — este par ya existe.'
      fra: 'Une permission est « resource:action » — cette paire existe déjà.'
      deu: 'Eine Berechtigung ist "resource:action" — dieses Paar existiert bereits.'
      ita: 'Un permesso è "resource:action" — questa coppia esiste già.'
      nld: 'Een recht is "resource:action" — dit paar bestaat al.'

  - name: PermissionKeyIsImmutableNotification
    semantic: validation
    description: >-
      An attempt to change the resource or the action after creation, which would rewrite
      the meaning of every existing grant and every issued token.
    text:
      eng: 'A permission is "resource:action" — neither half can be changed after creation.'
      ptbr: 'Uma permissão é "resource:action" — nenhuma das metades pode ser alterada após a criação.'
      esp: 'Un permiso es "resource:action" — ninguna de las dos mitades se puede modificar tras la creación.'
      fra: 'Une permission est « resource:action » — aucune des deux moitiés ne peut être modifiée après la création.'
      deu: 'Eine Berechtigung ist "resource:action" — nach der Erstellung kann keine der beiden Hälften geändert werden.'
      ita: 'Un permesso è "resource:action" — nessuna delle due metà può essere modificata dopo la creazione.'
      nld: 'Een recht is "resource:action" — na aanmaak kan geen van beide helften worden gewijzigd.'

  - name: PermissionDescriptionEchoesKeyNotification
    semantic: validation
    description: A description that merely repeats the resource:action string it should explain.
    text:
      eng: The description must explain the permission, not repeat it.
      ptbr: A descrição deve explicar a permissão, não repeti-la.
      esp: La descripción debe explicar el permiso, no repetirlo.
      fra: La description doit expliquer la permission, pas la répéter.
      deu: Die Beschreibung muss die Berechtigung erklären, nicht wiederholen.
      ita: La descrizione deve spiegare il permesso, non ripeterlo.
      nld: De beschrijving moet het recht uitleggen, niet herhalen.

  - name: InvalidResourceNameNotification
    package: vos
    semantic: validation
    description: >-
      A resource outside the accepted shape — a colon-joined path of lowercase slugs, or
      the wildcard `*` on its own.
    text:
      eng: 'A permission is "resource:action" — its resource half must be lowercase slugs joined by colons, or exactly "*".'
      ptbr: 'Uma permissão é "resource:action" — a metade "resource" deve ser composta por slugs minúsculos separados por dois-pontos, ou exatamente "*".'
      esp: 'Un permiso es "resource:action" — su mitad "resource" debe ser slugs en minúsculas separados por dos puntos, o exactamente "*".'
      fra: 'Une permission est « resource:action » — sa moitié « resource » doit être des slugs en minuscules séparés par des deux-points, ou exactement « * ».'
      deu: 'Eine Berechtigung ist "resource:action" — ihre "resource"-Hälfte muss aus durch Doppelpunkte getrennten Kleinbuchstaben-Slugs bestehen oder genau "*" sein.'
      ita: 'Un permesso è "resource:action" — la sua metà "resource" deve essere composta da slug minuscoli separati da due punti, o esattamente "*".'
      nld: 'Een recht is "resource:action" — de "resource"-helft moet bestaan uit kleine slugs gescheiden door dubbele punten, of exact "*".'

  - name: InvalidActionNameNotification
    package: vos
    semantic: validation
    description: >-
      An action outside the accepted shape — exactly one lowercase slug, with no colon, or
      the wildcard `*` on its own.
    text:
      eng: 'A permission is "resource:action" — its action half must be a single lowercase slug, or exactly "*".'
      ptbr: 'Uma permissão é "resource:action" — a metade "action" deve ser um único slug minúsculo, ou exatamente "*".'
      esp: 'Un permiso es "resource:action" — su mitad "action" debe ser un único slug en minúsculas, o exactamente "*".'
      fra: 'Une permission est « resource:action » — sa moitié « action » doit être un seul slug en minuscules, ou exactement « * ».'
      deu: 'Eine Berechtigung ist "resource:action" — ihre "action"-Hälfte muss ein einzelner Kleinbuchstaben-Slug oder genau "*" sein.'
      ita: 'Un permesso è "resource:action" — la sua metà "action" deve essere un singolo slug minuscolo, o esattamente "*".'
      nld: 'Een recht is "resource:action" — de "action"-helft moet één kleine slug zijn, of exact "*".'

  - name: UnmatchablePermissionKeyNotification
    package: vos
    semantic: validation
    description: >-
      A wildcard resource with a concrete action (`*:read`). The claim matcher honors only
      exact, resource:* and *:*, so such a row would match no route while reading like a
      sweeping grant.
    text:
      eng: 'A permission is "resource:action" — a wildcard resource requires the action to be "*" as well.'
      ptbr: 'Uma permissão é "resource:action" — um recurso curinga exige que a ação também seja "*".'
      esp: 'Un permiso es "resource:action" — un recurso comodín exige que la acción también sea "*".'
      fra: 'Une permission est « resource:action » — une ressource joker impose que l''action soit également « * ».'
      deu: 'Eine Berechtigung ist "resource:action" — eine Platzhalter-Ressource verlangt, dass auch die Aktion "*" ist.'
      ita: 'Un permesso è "resource:action" — una risorsa jolly richiede che anche l''azione sia "*".'
      nld: 'Een recht is "resource:action" — een jokerteken-resource vereist dat de actie ook "*" is.'

# No unarchive, no delete. Un-archiving would re-enable, in ONE call, every grant still
# pointing at that row: old users would silently regain a permission nobody re-approved,
# and the audit trail would read as a restore rather than as a grant. A retired permission
# comes back as a NEW row with a NEW id, granted explicitly. A hard delete is absent for
# the mirror reason: purging destroys the only human-readable record of what a past grant
# and a past token claim meant.
modes: [display, insert, update, archive]

update:
  # PATCH only: no sibling exists, every field is mandatory, so nothing needs PUT's ability
  # to assign null.
  shape: patch
  # STRUCTURAL immutability, the same belt-and-braces Tenant puts on its workspace handle:
  # the pair is not a member of the partial body at all, so there is no value to accept, no
  # value to write onto the entity, and nothing in the OpenAPI request schema claiming the
  # caller may edit it.
  #
  # The key-immutable rule below STAYS, and the two are not redundant. This key closes the
  # PATCH door; the rule guards the value itself on every update path, whatever door it came
  # through. Leaving only the rule would mean the API documents resource and action as
  # editable, accepts them, assigns them to the entity, and only then refuses — one layer
  # between a caller and a permission that silently changes meaning for everyone who already
  # holds it.
  patchExcludes: [Permission]

delete:
  root: soft

rules:
  # Format, length and presence live in the value objects and are never repeated here: the
  # framework validates a VO-backed field on every write, so a duplicate rule would report
  # the same problem twice for one empty value.
  list:
    - id: key-immutable
      kind: immutable
      scope: [update]
      fields: [Permission]
      notification: PermissionKeyIsImmutableNotification
      description: >-
        The pair IS the permission's identity everywhere except this table — the string in
        the JWT claim and the literal in RequirePermission(...). Editing it would rewrite
        the meaning of every existing grant, retroactively and invisibly. Description stays
        editable, which is not a degenerate update: operators improve wording after they
        read it.

  manual:
    - id: description-does-not-echo-key
      description: >-
        The description must differ from the rendered resource:action string under a
        normalized comparison — case-folded, with whitespace, colons and hyphens collapsed
        — which catches the lazy paste and nothing more. Render the pair through
        PermissionKey.String(); do not concatenate the parts here, the value object is the
        single home of the separator.
      scope: [insertOrUpdate]
      notification: PermissionDescriptionEchoesKeyNotification
      attachTo: Description

service:
  required: true
  facts:
    # The pre-check half of unique.enforce: service-precheck+constraint. Filtered by EVERY
    # part of the composite, so the question is about the PAIR — a second tenant:<something
    # else> is perfectly legal. Named for the PROBLEM, not the healthy state.
    - name: PermissionKeyTaken
      kind: exists
      filters: [Resource, Action]
      # An update must not collide with itself.
      excludeSelf: true
      # Active rows only: an archived tenant:export does not block a fresh one, which is
      # the only route back now that /unarchive does not exist.
      activeOnly: true
      description: >-
        Reports whether another ACTIVE permission already holds this resource and action
        pair. Excludes the row being updated.

read:
  # A RELATIONAL read model is its own KIND, not a flag on the projected one: it composes
  # from the tables at read time, so it materializes nothing and carries no version, no
  # collection, no registry row and no rebuild. Reads are read-your-writes — a permission
  # created is visible to the very next call, with no CDC round trip.
  view:
    # No maxLimit ON PURPOSE, mirroring Tenant: the page-size ceiling is OPERATIONAL state
    # and belongs in the service yaml (query.maxLimit), where it is tuned per environment
    # without regenerating anything. Declaring it here would be the per-view override,
    # pinning every environment to one number.
    name: permissions
  backing: relational
  # The framework's own stamps.
  # DeletedAt joined the two stamps on 2026-09-06, and what it replaced is worth keeping in
  # view: "DeletedAt stays OFF: archived state is reached through ?includeArchived, never
  # through a timestamp filter." That reasoning covered the FILTER, and was read as covering
  # the VALUE too — they are different questions. ?includeArchived decides whether an
  # archived row is in the answer at all; once it IS in the answer, nothing on the wire said
  # WHEN it was archived, or even that it was. The stamp is NOT declared in byParams.filters,
  # so the filter half of the original decision stands exactly as written.
  #
  # It is also what makes the sibling change coherent: other aggregates now republish this
  # column through their read joins, and a join republishing what its owner will not publish
  # was the objection that took the field out of Role's spec on 2026-08-24.
  managed: [CreatedAt, UpdatedAt, DeletedAt]
  # The read field no column holds. `from:` names the two STORED parts the derivation
  # reads — which is also what makes ?fields=permission push Resource + Action down to the
  # store automatically. The body is ours, written once, in the computed hook file; it
  # rebuilds the value object and calls String() rather than joining two strings.
  #
  # It is neither filterable nor sortable BY CONSTRUCTION: a computed path backs no column.
  # Filter the two sources instead — ?resource.eq=tenant&action.eq=read.
  computed:
    - name: Permission
      type: string
      from: [Resource, Action]
      labelKey: PermissionPermissionField
      example: tenant:read
      description: >-
        The permission as a token carries it and a route compares it: resource:action.
      text:
        eng: Permission
        ptbr: Permissão
        esp: Permiso
        fra: Permission
        deu: Berechtigung
        ita: Permesso
        nld: Recht
  byId: true
  byParams:
    # All THREE stored fields are filterable, the two hidden parts included: filters are
    # declared on the Request DTO and never consult the Response.
    filters:
      - {field: Resource, ops: [eq, ne, in, contains, startswith]}
      - {field: Action, ops: [eq, ne, in, contains]}
      - {field: Description, ops: [contains]}
      - {field: CreatedAt, ops: [gte, lte]}
      - {field: UpdatedAt, ops: [gte, lte]}
    # The ordering VOCABULARY, which also lives on the Request DTO and never on the
    # Response — so the lean wire shape costs no ordering. Resource is index-backed (it is
    # the prefix of the partial unique index on the pair); Action and Description are
    # blocking sorts, admitted deliberately because this catalog is bounded by the number
    # of resource:action pairs the platform's own routes enforce. The computed `permission`
    # is the one path that cannot be here; ID is declarable and deliberately is not.
    sort: [Resource, Action, Description]
    controls:
      pagination: true
      orderBy: true
      fields: true
      onlyTotal: true
      # A retired permission must stay auditable, and with no unarchive verb this listing
      # is the only way to see one.
      includeArchived: true
      # search is deliberately absent — a relational-served view answers free text with a
      # typed 400, and declaring it would promise what this posture cannot serve.
      # ?description.contains= covers the real need.

surfaces:
  rest: true
  graphql:
    # enabled alone is the whole declaration: both reads and every write verb the catalog
    # mounts. mutations and connection exist to SUBTRACT; nothing here is meant to be off.
    enabled: true
  # No CSV/XLSX exports: the catalog is small and operator-facing.

# CALLER-FACING prose, and the only place in this spec that reaches the OpenAPI document.
# Everything else here explains the entity to whoever maintains it; this block explains it to
# whoever is about to call it.
#
# It exists because the composition is invisible from the wire alone: a request carries
# `resource` and `action` as two separate keys, a response carries one rendered `permission`,
# and nothing on either side says the three are one concept. A caller who has not been told
# reads a 422 naming `action` and a 409 naming `permission` as two unrelated endpoints
# misbehaving.
docs:
  description: |
    **A permission is `resource:action`** — one pair, written as two keys.

    - `resource` — what is protected, as the enforcing route names it: `tenant`,
      `user:profile`, or `*` for every resource.
    - `action` — what may be done to it: `read`, `insert`, or `*` for every action.
    - `permission` — the two joined, `tenant:read`. This is the string a JWT claim carries
      and a route compares against, byte for byte. Reads return it; no request sends it.

    A rejection therefore names one of three fields, and which one tells you what to fix:
    `resource` or `action` when that half is malformed on its own, and `permission` when the
    complaint is about the PAIR — it is already taken, or it cannot match anything.
  operations:
    insert: |
      Send the two halves separately. They are refused, never repaired: `Tenant`, ` tenant `
      and `tenant:*` are all rejected rather than cleaned up, because the rendered pair is
      compared byte for byte against a token claim and a quietly repaired value would
      authorize nothing and explain nothing.

      A pair the catalog already holds answers **409**, naming `permission` and handing the
      refused pair back as `resource:action`. Only ACTIVE rows hold a pair: archiving one
      frees it, and re-inserting is the only way a retired permission comes back — as a new
      row, with a new id.

      A wildcard `*` is accepted as an ENTIRE half and nowhere else, and a `*` resource
      forces a `*` action: `*:read` is refused, because the claim matcher honours exactly
      `resource:action`, `resource:*` and `*:*`, so such a row would match no route while
      reading like a sweeping grant.
    patch: |
      **The pair cannot be changed** — `resource` and `action` are not part of this body, and
      sending them changes nothing. The pair IS the permission's identity in every issued
      token and every existing grant, so editing it would rewrite what all of them mean,
      retroactively and invisibly. A permission that should say something else is a new one.

      The description is editable, and that is the whole of this operation.
    byParams: |
      Filter and sort the two HALVES — `?resource.eq=tenant`,
      `?action.in=read,insert`, `?orderBy=resource`. The rendered `permission` is
      derived per row and backs no column, so it can be SELECTED (`?fields=permission`) but
      never filtered or ordered; asking for either answers a typed 400.

authz:
  resource: permission
  # The catalog is global by design — not partitioned by tenant, so there is no tenant_id
  # to filter on and no owner to check. Tenants never write it at all.
  dataAccess: anyone-with-permission
  permissions:
    insert: permission:insert
    patch: permission:update
    archive: permission:archive
    read: permission:read
