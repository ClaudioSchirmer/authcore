# Tenant — generated by omnicore-gen init.
#
# The slots this file could answer from the project are already answered;
# the rest is yours. FILL this template — do not replace it with a file
# written from scratch, which is how the wrong dialect and an unservable
# read backing get in.
#
# Before filling it in, run
#   omnicore-gen explain keys                 — every key there is
#   omnicore-gen explain example [sharedbase] — a whole spec that validates
# `explain keys` is the one that saves time: most of what looks like "the
# generator cannot express this" is a key whose name is not guessable.
#
# Every placeholder below is written in ENGLISH on purpose — the field, the
# rule id, the permission strings, `language`. None of it is a default worth
# keeping: rename them into the language your project speaks and into the
# permission taxonomy it already uses. English here means the template says
# nothing about a language it cannot know, not that the entity should be
# written in it.
#
# Discovered here: dialect(s) postgres · read backing relational.

specVersion: 1
entity: Tenant
# REQUIRED. It reaches the route path, the feature name and the listing
# types. No rule can spell it — an English heuristic writes neither
# "Matriculas" nor "Analyses" — so you declare it.
plural:
# The language the human-facing text of THIS spec is written in — the
# descriptions, the examples, the table and column comments. It seeds the
# matching label catalog; the other six fall back to the field name. Set it
# to what the project speaks (pt-BR, es, fr, de, it, nl) before you write
# a description in it — a description in one language under a declaration
# of another seeds the wrong catalog, silently.
language: en-US

storage:
  # flat = its own table. sharedbase-role = a ROLE over an identity that
  # other roles may share (a person who is a student today and staff later).
  # Starting flat and extracting a shared identity afterwards is a real
  # migration, so it is worth a minute now.
  kind: flat
  # Suggested from the entity name, in singular. Change it to whatever the
  # table is really called.
  table: tenant
  description: TODO — one line; it becomes the table comment.
  managed:
    # revision is required. The archive column is what makes archive/unarchive
    # possible at all — drop it and those verbs are refused.
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # A string needs a length: a zero-length column is rejected outright by
  # postgres, sqlserver and oracle. Money is int64 in minor units, never a
  # float. A value whose set is fixed is an enum value object, not a string.
  - name: Name
    type: string
    column: name
    length: 120
    livesOn: root
    example: TODO
    description: TODO — becomes the column comment and the field's label.

modes: [display, insert, update, archive, unarchive]

update:
  # patch is the common case. A sibling facet forces put or both, because
  # PATCH cannot say "set this to null" and the facet could never be cleared.
  shape: patch

delete:
  # soft = archive, reversible. hard = DELETE, a permanent purge — and the
  # HTTP verb has to tell the truth about which one it is.
  root: soft

rules:
  list:
    - id: name-required
      kind: required
      scope: [insertOrUpdate]
      fields: [Name]
      notification: RequiredFieldNotification
  # Anything the DSL cannot express goes here as a NAMED item. The text is
  # what the report tells the implementer to write, and it lands as a stub
  # in a file regeneration never touches.
  # manual:
  #   - id: some-rule
  #     description: >-
  #       What must be guaranteed, in one sentence someone can implement.
  #     scope: [insert]

read:
  backing: relational
  # relational: reads come straight from the tables, so a write is visible
  # to the very next read. This project has no mongo block, so it is the
  # only backing that can serve here.
  view:
    name: tenant
    version: 1
    maxLimit: 100
  byId: true
  byParams:
    filters:
      - {field: Name, ops: [eq, contains, icontains]}
    # A control is served ONLY if declared. Undeclared, its mere presence on
    # the wire is answered with a typed 400 — that is a contract, not an omission.
    controls:
      pagination: true
      orderBy: true
      includeArchived: true

# children:
#   - name: Item
#     # REQUIRED, and it is a PERSISTED key: the document segment, the read
#     # DTO field and the notification path, all from this one name.
#     plural: Items
#     table: TODO_items
#     # REQUIRED. A column name outlives the decision that made it.
#     parentColumn: TODO_id
#     ownedBy: root
#     # atomic-replace: the root's update swaps the WHOLE collection.
#     # per-child: POST/PUT/DELETE per entry, a duplicate answer on add
#     # (declare duplicateNotification) and a 404 for an entry that is
#     # not there. Adding one entry should not mean resending the rest.
#     editStrategy: atomic-replace
#     businessIdentity: [TODO]
#     fields: []

surfaces:
  rest: true
  # graphql: {enabled: true, connection: true, mutations: [insert, update, archive, unarchive]}
  # exports: {csv: {delimiter: ";"}, xlsx: {sheet: TODO}}

authz:
  resource: tenant
  # anyone-with-permission means every holder of the permission sees every
  # row. owner-only and tenant narrow it — and that is a different question
  # from the permission itself, which is why both are asked.
  dataAccess: anyone-with-permission
  # SUGGESTED strings — the taxonomy is yours, and nothing here enforces
  # this one. What IS required is that every served operation carries a
  # permission: with authorization enabled, a route without one aborts boot.
  # The suggestion is <resource>:<action> with the action spelling the
  # operation, PUT and PATCH sharing :update and unarchive sharing :archive
  # — one verb and its undo. It exists because the alternative writes itself
  # differently every time (create here, write there) and a deployment ends
  # up granting three words for one thing. If this project already grants
  # something else — in any language — rewrite these to it: a permission is
  # matched EXACTLY against what the caller's token carries.
  permissions:
    insert: tenant:insert
    patch: tenant:update
    archive: tenant:archive
    unarchive: tenant:archive
    read: tenant:read
