# authcore — the QA CONTRACT SUITE profile. Owned by qa/, not by the service.
#
# THIS FILE IS THE SUITE'S, NOT THE PROJECT'S. It exists so the suite never writes into
# a database the dev cares about: it is microservice.dev.yaml with exactly two values
# changed — the DSN points at the throwaway `authcore_qa_db`, and the listener moves off
# the dev port. Everything else, auth included, is byte-for-byte the dev profile,
# because a QA run that validated differently from dev would prove the wrong thing.
#
# Selected with OMNICORE_CONFIG_PATH=qa/microservice.qa.yaml (APP_PROFILE stays `dev`,
# which is what keeps migrations.autoRun on — the suite relies on it to rebuild the
# schema AND the bootstrap seed into a database it just created).
#
# Regenerated by /omnicore:qa. If microservice.dev.yaml changes shape, re-run the skill
# rather than hand-patching this copy.
#
# generated: 2026-09-01 · plan: specs/qa/tenant/plan.md

service: authcore

http:
  # The suite's own port. Overridable per lane so two lanes never bind the same
  # socket; whoever overrides it must move AUTH_SELF_URL with it, since this
  # service issues and validates its own tokens and the two must agree.
  addr: "${QA_HTTP_ADDR::8099}"

  # NO trustProxy BLOCK, and that is correct for this bench: the service is reached
  # directly on localhost, so the socket peer IS the caller. Declaring one here would
  # make `127.0.0.1` a trusted proxy and let any local process forge its own origin
  # through X-Forwarded-For — which is exactly the hole the block exists to close.
  #
  # It matters here because POST /auth/client/token compares Client.allowedCIDRs
  # against the resolved address. On this bench that is `127.0.0.1`, so a fixture
  # client with an allow-list must name `127.0.0.1/32` and not your LAN range.

# Source of truth. No mongo: block and no transport: block — that absence IS the
# declaration of the posture: reads are served straight from these tables
# (.RelationalSource), so a write is visible to the very next read. See
# scaffold-service/spec.md for what that buys and what it costs.
relational:
  dialect: postgres
  dsn: "${QA_DATABASE_URL:postgres://omnicore:omnicore@localhost:5432/authcore_qa_db?sslmode=disable}"
  # Mandatory since v0.65.0, no default. `db` reads the write instant from Postgres once
  # per write transaction, so every replica stamps created_at/updated_at/deleted_at against
  # one clock instead of its own; `app` would keep time.Now().UTC() and each pod's drift.
  # One extra round-trip per write TX. The value is the SAME in prd on purpose — dev and
  # prd must not write their histories against different clocks.
  clock: db

migrations:
  dir: ./migrations/postgres
  # autoRun is left unset: it resolves to true under dev (and to the strict check mode
  # under every other profile), which is exactly the wanted behavior here.

# Honored only because Wiring.OpenAPI is set in bootstrap/wire.go.
openapi:
  uiPath: /docs
  rootRedirect: true

# Serving knobs only. The surface stays unmounted until a feature implements
# bootstrap.GraphQLFeature — on the empty shell this block is inert.
graphql:
  path: /graphql
  uiPath: /graphql/ui
  playground: true
  introspection: true

# ─────────────────────────────────────────────────────────────────────────────
# AUTH — THE DEV BENCH IS CLOSED, ON PURPOSE.
#
# `auth.mode: disabled` was removed on 2026-08-26. A bench that answers without a
# token proves nothing about a service whose entire job is deciding who may do
# what: every row-scope guard stands down with no identity (each one asks whether
# an identity was PRESENT before comparing anything), so the tests that matter
# most were the tests not running. Dev now validates like production does.
#
# THIS SERVICE IS ITS OWN IdP. It signs with auth.issuer below and validates with
# auth.jwt here, and the two are wired to each other: jwksUrl points back at the
# route auth.issuer.jwks mounts. selfUrl must EQUAL jwt.issuer — the framework
# refuses the boot otherwise, because a service that issues and validates cannot
# disagree with itself about who it is.
#
# The self-reference resolves itself, and the boot log says so out loud. At boot
# the JWKS fetch hits a port nothing is listening on yet; the client is built with
# NoErrorReturnFirstHTTPReq, so that is a WARN and not a boot failure ("JWKS
# endpoint returned no keys on first fetch"). The first request carrying a token
# presents an unknown `kid`, which triggers a refresh — and by then the listener
# is up. Nothing to configure, nothing to order.
# ─────────────────────────────────────────────────────────────────────────────
auth:
  mode: jwt

  jwt:
    algorithms: [RS256]
    issuer: "${AUTH_SELF_URL:http://localhost:8099}"
    audience: "${AUTH_AUDIENCE:authcore}"
    jwksUrl: "${AUTH_SELF_URL:http://localhost:8099}/.well-known/jwks.json"

  # The permission gate. Enabled here so a route that forgets RequirePermission
  # aborts the boot instead of shipping open — the scan runs over every
  # registered route at startup.
  authorization:
    enabled: true
    # Every user in this service belongs to exactly one tenant (users.tenant_id is
    # NOT NULL), so a token without the claim is malformed rather than merely
    # unscoped: required rejects it at the middleware with 403, before any handler
    # can read a row with an empty scope.
    tenant:
      enabled: true
      required: true

  # The claims that reach audit_events.actorClaims. Deliberately SHORT: Actor
  # (the subject) and TenantID are already top-level fields on every audit event,
  # so listing them here would only duplicate them into the JSON blob, where they
  # are worse to query than the indexed column.
  #
  # These two are the ones with no other vehicle. tenant_workspace because no
  # other service in the mesh has this service's tenants table — without it every
  # audit line out there identifies its tenant by a bare UUID it cannot resolve at
  # any price. email because Actor on its own is a UUID too.
  #
  # Authorization state (groups, roles, permissions) is deliberately ABSENT: an
  # audit trail records who acted, not what they were entitled to, and those are
  # variable-length arrays that would be copied into every row, one per write.
  auditClaims:
    - tenant_workspace
    - email
    # name is the CLIENT's analogue of email: a machine has no address, so its label
    # is the only human-readable thing an audit row could carry about who acted. The
    # user token already mints it, so this is one vocabulary rather than a per-kind
    # special case — the cost, said plainly, is that user audit rows gain a short
    # name string beside the email they already carry.
    - name
    # identity_kind says PERSON or MACHINE without anybody cross-referencing the
    # clients table. Both token routes mint it, so an audit row that lacks it was
    # written by neither.
    - identity_kind

  # THIS SERVICE MINTS ITS OWN TOKENS. The framework ships the Issuer and the JWKS
  # route; every HTTP endpoint on top of it is ours (internal/web/authentication_routes_manual.go).
  issuer:
    enabled: true
    # Never inherited from jwt.issuer, always explicit — a service may issue
    # without validating locally. When both blocks exist they must agree.
    selfUrl: "${AUTH_SELF_URL:http://localhost:8099}"
    audience:
      - "${AUTH_AUDIENCE:authcore}"
    tokenTtlSeconds: 900
    maxTokenTtlSeconds: 3600
    refreshTokenTtlSeconds: 2592000
    keys:
      # No default, deliberately: a signing key has no sensible fallback, and an
      # empty PEM fails the boot with a diagnostic instead of signing with
      # something predictable. start.sh generates one on first run and exports it.
      - kid: "${JWT_SIGNING_KID:dev}"
        algorithm: RS256
        state: current
        privateKeyPem: "${JWT_SIGNING_KEY}"
    # The block's PRESENCE is the switch. It mounts GET <path> as a public route
    # automatically — a JWKS document that needed a bearer to fetch could never
    # bootstrap trust in itself.
    jwks:
      path: /.well-known/jwks.json

  # Exact "METHOD /path", validated at boot against the registered routes: a typo,
  # a wrong method or a trailing slash aborts the boot naming the offender.
  #
  # The probes are framework-owned but NOT auto-public: without these a tokenless
  # kubelet gets 401. The two token routes are here for the obvious reason — a
  # login cannot require the credential it is about to grant.
  #
  # /openapi.json, the /docs UI and (because rootRedirect is on) GET / are
  # extended onto this list by the framework itself; they are not repeated here.
  # The JWKS route is added by the issuer block above, likewise.
  publicRoutes:
    - GET /livez
    - GET /readyz
    - POST /auth/user/token
    - POST /auth/user/token/refresh
    # The machine sign-in. Public for the same reason as the two above, and there is
    # no /refresh companion: a client-credentials grant issues no refresh token
    # (RFC 6749 4.4.3) because the client's secret already IS its long-lived
    # credential.
    #
    # WHERE FROM: Client.allowedCIDRs is enforced at this route and nowhere else, and
    # it compares against the ORIGIN ADDRESS AS THIS PROCESS SEES IT — the socket peer.
    # The framework reads no proxy header (it sets neither TrustProxy nor ProxyHeader
    # on the Fiber app), which is why nothing here is spoofable; the flip side is that
    # behind an ingress or a load balancer every request carries the BALANCER's
    # address, so an allow-list of real egress ranges refuses everybody and one
    # holding the balancer's range admits everybody. Leave the collection empty on
    # such a deployment until omnicore ships a trusted-proxy block.
    - POST /auth/client/token

# No audit: block — the framework default keeps both destinations active
# (in-transaction audit_events row + post-commit slog line).

shutdown:
  drainTimeoutSeconds: 30
  tracingDrainSeconds: 5
  hardGraceSeconds: 5
